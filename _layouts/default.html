<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>

  <!-- Floating Background Particle Container -->
  <div class="particles" id="particles-container"></div>

  {% include header.html %}

  <main class="page animate-fade-in" id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Quick View Project Modal -->
  {% include project-modal.html %}

  <!-- Back to Top Button -->
  <button class="back-to-top" id="back-to-top" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>

  <!-- JavaScript Modules -->
  <script src="{{ '/assets/js/particles.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>
</html>
