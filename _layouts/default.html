---
layout: jekyll-theme-minimal
---

<!--
  We use the existing Jekyll theme for base scaffolding,
  and inject our own minimal header/nav + footer.
-->

<header class="site-header">
  <div class="nav-container">
    <a class="brand" href="{{ '/' | relative_url }}">Your Name</a>

    <nav class="nav">
      <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
      <a class="nav-link" href="{{ '/about' | relative_url }}">About</a>
      <a class="nav-link" href="{{ '/projects' | relative_url }}">Projects</a>
      <a class="nav-link" href="{{ '/contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>

<main class="page">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="footer-container">
    <span>© {{ 'now' | date: '%Y' }} Your Name. All rights reserved.</span>
  </div>
</footer>
