---
layout: default
title: Projects
permalink: /projects
---

<section class="section animate-fade-in delay-1">
  <div class="page-header">
    <h1 class="page-title">Selected Projects</h1>
    <p class="lead">A showcase of systems, applications, and interactive tools built with modern web technologies.</p>
  </div>

  <!-- Interactive Category / Tag Filter Controls -->
  <div class="filter-controls" id="project-filters">
    <button class="filter-btn active" data-filter="all">All Projects</button>
    <button class="filter-btn" data-filter="react">React / Next.js</button>
    <button class="filter-btn" data-filter="python">Python / AI</button>
    <button class="filter-btn" data-filter="css">CSS / UI</button>
    <button class="filter-btn" data-filter="web app">Web Apps</button>
  </div>

  <div class="grid grid-2" id="projects-grid" style="margin-top: 2.5rem;">
    {% for project in site.data.projects %}
      {% include project-card.html project=project %}
    {% endfor %}
  </div>
</section>
