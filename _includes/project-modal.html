<div class="mode-modal-overlay" id="project-modal">
  <div class="mode-modal-container" style="max-width: 720px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px;">
      <div>
        <span class="badge" id="modal-category">WEB SYSTEM</span>
        <h3 id="modal-title" style="font-size: 1.8rem; margin-top: 8px;">PROJECT TITLE</h3>
      </div>
      <button class="btn btn-outline" id="project-modal-close" style="padding: 6px 12px; font-size: 0.8rem;">[ CLOSE ]</button>
    </div>

    <p id="modal-desc" style="color: var(--text-muted); font-size: 1rem; margin-bottom: 24px; line-height: 1.6;">
      Detailed system specification and telemetry report for the selected project.
    </p>

    <div class="terminal-block" style="margin-bottom: 24px;">
      <div class="terminal-header">
        <span>PROJECT_DIAGNOSTICS.SH</span>
        <span>STATUS: 200 OK</span>
      </div>
      <div class="terminal-body">
        <pre id="modal-code" style="font-family: var(--font-mono); color: var(--cyan); white-space: pre-wrap; font-size: 0.82rem; margin: 0;"></pre>
      </div>
    </div>

    <div style="display: flex; gap: 16px;">
      <a class="btn" id="modal-github" href="https://github.com/EchoedDestiny428" target="_blank" rel="noopener">REPOSITORY</a>
      <a class="btn btn-outline" id="modal-demo" href="#" target="_blank" rel="noopener">LIVE SYSTEM</a>
    </div>
  </div>
</div>
