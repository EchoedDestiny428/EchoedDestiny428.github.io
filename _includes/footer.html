<footer class="site-footer">
  <div class="container footer-content">
    <div>
      <span style="color: var(--cyan); margin-right: 8px;">[SYS_STATUS: NOMINAL]</span>
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.data.site_info.brand_name }}. ALL RIGHTS RESERVED.</span>
    </div>

    <div class="footer-socials">
      {% for social in site.data.socials %}
        <a class="footer-social-link" href="{{ social.url }}" target="_blank" rel="noopener noreferrer">
          // {{ social.name }}
        </a>
      {% endfor %}
    </div>
  </div>
</footer>
